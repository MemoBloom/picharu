name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  GENERATION_ENABLED: 'false'
  MODEL_PROFILES_JSON: '[]'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install with Vercel settings
        working-directory: apps/web
        env:
          NODE_ENV: production
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const { installCommand } = require('./vercel.json');
          execSync(installCommand, { stdio: 'inherit' });
          NODE
      - run: npm run verify
      - name: Google read preflight offline regression (Python 3)
        run: python3 -m unittest discover -s tests -p test_google_read_preflight.py

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          cluster_dir=$(mktemp -d /tmp/picjp-ci-XXXXXX)
          mkdir "$cluster_dir/socket"
          container="picjp-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PGHOST=$cluster_dir/socket" >> "$GITHUB_ENV"
          echo 'PGPORT=5432' >> "$GITHUB_ENV"
          echo 'PGUSER=picjp_ci' >> "$GITHUB_ENV"
          echo "PICJP_PG_CONTAINER=$container" >> "$GITHUB_ENV"
          docker run --detach --name "$container" \
            --mount "type=bind,source=$cluster_dir/socket,target=/var/run/postgresql" \
            --env POSTGRES_USER=picjp_ci --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17 -c listen_addresses='' -c unix_socket_permissions=0777
          for attempt in $(seq 1 60); do
            if docker exec "$container" sh -c 'test "$(cat /proc/1/comm)" = postgres && pg_isready -U picjp_ci -d postgres'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - run: npm run test:concurrency
      - name: Remove test database container
        if: always()
        shell: bash
        run: |
          if [ -n "${PICJP_PG_CONTAINER:-}" ]; then
            docker logs "$PICJP_PG_CONTAINER" || true
            docker rm --force "$PICJP_PG_CONTAINER" || true
          fi

  seo-production:
    name: SEO production HTML (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [enabled, disabled, preview]
    env:
      SEO_INDEXING_ENABLED: ${{ matrix.mode == 'disabled' && 'false' || 'true' }}
      VERCEL_ENV: ${{ matrix.mode == 'preview' && 'preview' || 'production' }}
      SEO_CONTENT_BACKEND: git
      SEO_ANALYTICS_ENABLED: 'false'
      NEXT_PUBLIC_ANALYTICS_ENABLED: 'false'
      NEXT_PUBLIC_GA4_ENABLED: 'false'
      SEO_TEST_OUTPUT: /tmp/seo-production.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:seo:production

  seo-publishing:
    name: SEO database publication and ISR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:seo:publishing

  seo-collector-image:
    name: SEO Node22 collector image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile.seo -t picmoko-seo-test .
      - run: docker run --rm --network none picmoko-seo-test --help
